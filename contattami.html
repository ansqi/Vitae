  <body>
    <nav class="navbar navbar-expand-md site-nav sticky-top">
      <div class="container">
        <a class="navbar-brand" href="index.html">Andrea Squillace</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
          aria-controls="mainNav"
          aria-expanded="false">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto align-items-md-center gap-md-3">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item"><a class="nav-link" href="cv.html">CV</a></li>

              ></a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <main class="container section-space contact-landing">
      <div class="contact-title">
        <div class="contact-intro">
          <h1>Hai un progetto in mente?</h1>
          <p class="lead">
            Lasciami pure un messaggio. Ti rispondo appena possibile.
          </p>
        </div>

        <div class="contact-card">
          <form id="contact-form" class="contact-form">
            <div class="mb-4">
              <label for="name">Nome</label>
              <input
                type="text"
                id="name"
                name="name"
                autocomplete="name"
                required
              />
            </div>
            <div class="mb-4">
              <label for="email">Email</label>
              <input
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                required
              />
            </div>
            <div class="mb-4">
              <label for="message">Messaggio</label>
              <textarea
                id="message"
                name="message"
                rows="5"
                required
              ></textarea>
            </div>
            <button class="btn btn-dark" type="submit">
              Invia messaggio <span aria-hidden="true"></span>
            </button>
            <p id="form-status" class="form-note" role="status" aria-live="polite"></p>
          </form>
        </div>

        <div class="contact-note">
          <span>Altrimenti</span>
          <a
            href="https://www.linkedin.com/in/andrea-squillace-a8875159/"
            target="_blank"
            rel="noreferrer"
            >Cercami su LinkedIn
            <i class="fa-brands fa-linkedin" aria-hidden="true"></i>
          </a>
        </div>
      </div>
    </main>
    <footer class="site-footer">
   <div class="container">
        <span>© <span data-current-year></span> Andrea</span>
        <div class="social-links">

            LinkedIn</a

            ><i class="fa-brands fa-github" aria-hidden="true"></i> GitHub</a
          ><a href="https://www.instagram.com/andre.squillace/" target="_blank" rel="noreferrer"
            ><i class="fa-brands fa-instagram" aria-hidden="true"></i> Instagram</a
          >
        </div>
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
